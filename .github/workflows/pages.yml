name: Deploy static workbench to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx vite build --base /chamfer/
      - name: Rewrite root links for /chamfer/ Pages subpath
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            for (const file of ['dist/index.html', 'dist/drafting.html', 'dist/plate.html']) {
              let html = fs.readFileSync(file, 'utf8');
              html = html
                .replaceAll('href=\"/plate.html\"', 'href=\"/chamfer/plate.html\"')
                .replaceAll('href=\"/\"', 'href=\"/chamfer/\"')
                .replaceAll('href=\"/mark.svg\"', 'href=\"/chamfer/mark.svg\"')
                .replaceAll('src=\"/mark.svg\"', 'src=\"/chamfer/mark.svg\"');
              fs.writeFileSync(file, html, 'utf8');
            }
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
